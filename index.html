<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保留ボタン</title>
  
  <link rel="apple-touch-icon" href="icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="保留ボタン">
  <meta property="og:description" content="毎日に保留という選択肢を">
  <meta property="og:image" content="https://wasabi0205.github.io/Horyu-button/icon.png">
  <meta name="twitter:card" content="summary">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8; color: #1e293b;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 32px 16px;
    }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px; }
    header { text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
    .sub-title { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

    .image-preview-area {
      display: none; flex-direction: column; align-items: center; gap: 16px;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    canvas { width: 100%; height: auto; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2); }

    .share-container { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .share-label { font-size: 0.8rem; color: #64748b; text-align: center; font-weight: 600; }
    .share-buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .action-buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .share-btn {
      padding: 10px 0; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: bold;
      color: #ffffff; cursor: pointer; text-decoration: none; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn-x { background-color: #000000; }
    .btn-line { background-color: #06c755; }
    .btn-fb { background-color: #1877f2; }
    .btn-copy-img { background-color: #2563eb; }
    .btn-download { background-color: #475569; }

    .input-group {
      display: flex; flex-direction: column; gap: 12px; background-color: #ffffff;
      padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0;
    }
    input[type="text"] {
      width: 100%; padding: 14px; font-size: 1rem; border: 1.5px solid #cbd5e1;
      border-radius: 10px; outline: none; background-color: #f8fafc; color: #0f172a; text-align: center;
    }
    .preset-container { display: flex; gap: 6px; }
    .preset-btn {
      flex: 1; background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1;
      padding: 10px 0; font-size: 0.8rem; font-weight: 600; border-radius: 8px; cursor: pointer;
    }
    .action-btn {
      background-color: #1e3a8a; color: #ffffff; font-size: 1.1rem; font-weight: 700;
      padding: 16px; border: none; border-radius: 10px; cursor: pointer;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 16px; text-align: center; max-width: 360px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .modal-content img { width: 100%; border-radius: 8px; }
    .close-btn { padding: 8px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⏸️ 保留ボタン</h1>
      <p class="sub-title">今決めない、知的でポジティブな選択</p>
    </header>

    <div id="imagePreviewArea" class="image-preview-area">
      <canvas id="holdCanvas" width="800" height="800"></canvas>
      
      <div class="share-container">
        <div class="share-label">＼ SNSでシェア・画像を共有 ／</div>
        <div class="share-buttons-grid">
          <a id="shareX" class="share-btn btn-x" target="_blank">X</a>
          <a id="shareLine" class="share-btn btn-line" target="_blank">LINE</a>
          <a id="shareFb" class="share-btn btn-fb" target="_blank">Facebook</a>
        </div>
        <div class="action-buttons-grid">
          <button type="button" class="share-btn btn-copy-img" onclick="copyCanvasImage()">📋 画像コピー</button>
          <button type="button" class="share-btn btn-download" onclick="downloadImage()">💾 画像保存</button>
        </div>
      </div>
    </div>

    <div class="input-group">
      <input type="text" id="targetText" placeholder="何について保留しますか？">
      
      <div class="preset-container">
        <button type="button" class="preset-btn" onclick="appendPreset('という判断')">という判断</button>
        <button type="button" class="preset-btn" onclick="appendPreset('という結論')">という結論</button>
        <button type="button" class="preset-btn" onclick="appendPreset('という評価')">という評価</button>
      </div>

      <button type="button" class="action-btn" onclick="generateHoldCard()">保留</button>
    </div>
  </div>

  <div id="copyModal" class="modal">
    <div class="modal-content">
      <p style="font-weight: bold; font-size: 0.9rem;">画像を長押し（または右クリック）して「コピー」または「保存」してください</p>
      <img id="modalImg" src="" alt="保留カード">
      <button class="close-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    const GITHUB_USER = 'wasabi0205';
    const GITHUB_REPO = 'Horyu-button';
    const FOLDER_PATH = 'images';

    // 🌐 多言語対応用の定型文定義
    const CURRENT_LANG = 'ja';
    const TRANSLATIONS = {
      ja: { suffix: 'を保留しました' },
      en: { suffix: 'Put on Hold' }
    };

    function appendPreset(textToAppend) {
      var inputEl = document.getElementById('targetText');
      inputEl.value = inputEl.value + textToAppend;
      inputEl.focus();
    }

    function generateHoldCard() {
      var val = document.getElementById('targetText').value;
      if (!val || !val.trim()) {
        alert('保留する内容を入力してください');
        return;
      }

      var text = val.trim();
      var canvas = document.getElementById('holdCanvas');
      var ctx = canvas.getContext('2d');

      var apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;

      // GitHub APIから画像一覧とbg_config.jsonを取得
      Promise.all([
        fetch(apiUrl).then(res => res.json()),
        fetch(`${FOLDER_PATH}/bg_config.json`).then(res => res.ok ? res.json() : {}).catch(() => ({}))
      ])
      .then(([files, configMap]) => {
        var imageFiles = files.filter(file => file.name.match(/\.(png|jpe?g|webp|gif)$/i));

        if (imageFiles.length === 0) {
          alert('images フォルダ内に画像が見つかりませんでした。');
          return;
        }

        var randomIndex = Math.floor(Math.random() * imageFiles.length);
        var selectedImage = imageFiles[randomIndex];
        var imageName = selectedImage.name;
        var imageConfig = configMap[imageName] || {};

        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = selectedImage.download_url;

        img.onload = function() {
          ctx.clearRect(0, 0, 800, 800);
          ctx.drawImage(img, 0, 0, 800, 800);

          drawOverlayTextWithConfig(ctx, text, imageConfig);

          document.getElementById('imagePreviewArea').style.display = 'flex';

          var shareText = encodeURIComponent(`「${text}」${TRANSLATIONS[CURRENT_LANG].suffix}。 #保留ボタン`);
          var pageUrl = encodeURIComponent(window.location.href);

          document.getElementById('shareX').href = `https://twitter.com/intent/tweet?text=${shareText}&url=${pageUrl}`;
          document.getElementById('shareLine').href = `https://line.me/R/msg/text/?${shareText}%20${pageUrl}`;
          document.getElementById('shareFb').href = `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}`;
        };
      })
      .catch(err => {
        alert('画像の読み込みに失敗しました。');
        console.error(err);
      });
    }

    function drawOverlayTextWithConfig(ctx, text, config) {
      ctx.textAlign = 'center';

      // 1. ユーザー入力テキスト
      var inputCfg = config.input || {};
      var inputColor = inputCfg.color || '#0F172A';
      var inputStroke = inputCfg.strokeColor || '#FFFFFF';
      var inputFont = inputCfg.font || 'bold 50px sans-serif';
      var startY = inputCfg.y || 360;

      ctx.font = inputFont;
      
      let words = text.split('');
      let line = '';
      let lines = [];
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n];
        if (ctx.measureText(testLine).width > 540 && n > 0) {
          lines.push(line); line = words[n];
        } else { line = testLine; }
      }
      lines.push(line);

      lines.forEach((l, index) => {
        let y = startY + (index * 68);
        ctx.strokeStyle = inputStroke;
        ctx.lineWidth = 14;
        ctx.strokeText(l, 400, y);
        ctx.fillStyle = inputColor;
        ctx.fillText(l, 400, y);
      });

      // 2. 「保留しました」定型テキスト
      var suffixText = TRANSLATIONS[CURRENT_LANG].suffix;
      
      var suffixCfg = config.suffix || {};
      var suffixColor = suffixCfg.color || '#2563eb';
      var suffixStroke = suffixCfg.strokeColor || '#FFFFFF';
      var suffixFont = suffixCfg.font || 'bold 44px sans-serif';
      var suffixY = suffixCfg.y || (startY + (lines.length * 68) + 20);

      ctx.font = suffixFont;
      ctx.strokeStyle = suffixStroke;
      ctx.lineWidth = 12;
      ctx.strokeText(suffixText, 400, suffixY);
      ctx.fillStyle = suffixColor;
      ctx.fillText(suffixText, 400, suffixY);
    }

    function copyCanvasImage() {
      var canvas = document.getElementById('holdCanvas');
      if (!navigator.clipboard || !window.ClipboardItem) {
        showCopyModal(); return;
      }
      canvas.toBlob(function(blob) {
        try {
          var item = new ClipboardItem({ "image/png": blob });
          navigator.clipboard.write([item]).then(function() {
            alert('画像をクリップボードにコピーしました！');
          }).catch(function() { showCopyModal(); });
        } catch (err) { showCopyModal(); }
      });
    }

    function showCopyModal() {
      var canvas = document.getElementById('holdCanvas');
      document.getElementById('modalImg').src = canvas.toDataURL();
      document.getElementById('copyModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('copyModal').style.display = 'none';
    }

    function downloadImage() {
      var canvas = document.getElementById('holdCanvas');
      var link = document.createElement('a');
      link.download = 'pending-card.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
