<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保留ボタン</title>
  
  <link rel="apple-touch-icon" href="icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="保留ボタン">
  <meta property="og:description" content="即断即決しなくたっていいじゃない">
  <meta property="og:image" content="https://wasabi0205.github.io/Horyu-button/icon.png">
  <meta name="twitter:card" content="summary">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8; color: #1e293b;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 32px 16px;
    }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px; }
    header { text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
    .sub-title { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

    .image-preview-area {
      display: none; flex-direction: column; align-items: center; gap: 16px;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    canvas { width: 100%; height: auto; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2); }

    .share-container { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .share-label { font-size: 0.8rem; color: #64748b; text-align: center; font-weight: 600; }
    .share-buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    .share-btn {
      padding: 12px 0; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: bold;
      color: #ffffff; cursor: pointer; text-decoration: none; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn-share { background-color: #0f172a; }
    .btn-copy-img { background-color: #2563eb; }
    .btn-download { background-color: #475569; }

    .input-group {
      display: flex; flex-direction: column; gap: 12px; background-color: #ffffff;
      padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0;
    }
    input[type="text"] {
      width: 100%; padding: 14px; font-size: 1rem; border: 1.5px solid #cbd5e1;
      border-radius: 10px; outline: none; background-color: #f8fafc; color: #0f172a; text-align: center;
    }
    .preset-container { display: flex; gap: 6px; }
    .preset-btn {
      flex: 1; background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1;
      padding: 10px 0; font-size: 0.8rem; font-weight: 600; border-radius: 8px; cursor: pointer;
    }
    .action-btn {
      background-color: #1e3a8a; color: #ffffff; font-size: 1.1rem; font-weight: 700;
      padding: 16px; border: none; border-radius: 10px; cursor: pointer;
    }

    .pwa-notice {
      background: #eff6ff; border: 1px dashed #93c5fd; border-radius: 12px;
      padding: 12px 16px; text-align: center; font-size: 0.82rem; color: #1e40af; line-height: 1.5;
    }

    .recruitment-box {
      text-align: center; font-size: 0.82rem; color: #64748b; margin-top: 4px;
    }
    .recruitment-link {
      color: #2563eb; font-weight: bold; text-decoration: underline; cursor: pointer;
      background: none; border: none; font-size: inherit; padding: 0;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 16px; text-align: center; max-width: 360px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .modal-content img { width: 100%; border-radius: 8px; }
    .close-btn { padding: 8px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="appTitle">⏸️ 保留ボタン</h1>
      <p id="appSubTitle" class="sub-title">今決めない、知的でポジティブな選択</p>
    </header>

    <div id="imagePreviewArea" class="image-preview-area">
      <canvas id="holdCanvas" width="800" height="800"></canvas>
      
      <div class="share-container">
        <div id="shareLabel" class="share-label">＼ 画像を共有・保存 ／</div>
        <div class="share-buttons-grid">
          <button type="button" id="btnShare" class="share-btn btn-share" onclick="shareImage()">📤 シェア</button>
          <button type="button" id="btnCopyImg" class="share-btn btn-copy-img" onclick="copyCanvasImage()">📋 コピー</button>
          <button type="button" id="btnDownload" class="share-btn btn-download" onclick="downloadImage()">💾 保存</button>
        </div>
      </div>
    </div>

    <div class="input-group">
      <input type="text" id="targetText" placeholder="何について保留しますか？">
      
      <div class="preset-container">
        <button type="button" id="preset1" class="preset-btn" onclick="appendPreset('という判断')">という判断</button>
        <button type="button" id="preset2" class="preset-btn" onclick="appendPreset('という結論')">という結論</button>
        <button type="button" id="preset3" class="preset-btn" onclick="appendPreset('という評価')">という評価</button>
      </div>

      <button type="button" id="actionBtn" class="action-btn" onclick="generateHoldCard()">保留</button>

      <div id="pwaNotice" class="pwa-notice">
        📱 あなたのスマホに保留ボタンを出したい方は<br><strong>共有からホーム画面に追加</strong>を
      </div>

      <div class="recruitment-box">
        🎨 <button type="button" class="recruitment-link" onclick="copySpecToClipboard()">背景画像募集中！（クリックで仕様をコピー）</button>
      </div>
    </div>
  </div>

  <div id="copyModal" class="modal">
    <div class="modal-content">
      <p id="modalMsg" style="font-weight: bold; font-size: 0.9rem;">画像を長押し（または右クリック）して「コピー」または「保存」してください</p>
      <img id="modalImg" src="" alt="保留カード">
      <button class="close-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    const GITHUB_USER = 'wasabi0205';
    const GITHUB_REPO = 'Horyu-button';
    const FOLDER_PATH = 'images';

    const userLang = (navigator.language || navigator.userLanguage || 'ja').startsWith('ja') ? 'ja' : 'en';

    const TRANSLATIONS = {
      ja: {
        title: '⏸️ 保留ボタン',
        subTitle: '今決めない、知的でポジティブな選択',
        placeholder: '何について保留しますか？',
        preset1: 'という判断',
        preset2: 'という結論',
        preset3: 'という評価',
        actionBtn: '保留',
        suffix: 'を保留しました',
        messages: [
          '✨ 見事な判断力！', '🏆 殿堂級の英断', '🌿 白黒つけなくたっていいじゃない',
          '💡 新しい視点が芽生える予感', '☕️ まずは一息入れる余裕', '🧠 熟成させる時間こそ宝',
          '🎯 最高のタイミングを見極める選択', '🕊️ 心の平和を守るファインプレー', '💎 勇気ある「保留」に拍手',
          '🧘 焦らない大人の戦略', '🌟 今日の自分を褒め称えよう', '🍷 答えが熟すのを待つ時間',
          '🚀 次の一手をじっくり練る時間', '🛡️ 感情に流されないスマートな選択', '🎉 判断保留という名の決断！',
          '🍀 余白を楽しむ余裕', '🦉 知的な戦略的撤退（一時的）', '👑 自分のペースを守り抜いた証',
          '⏳ 時が解決してくれることもある', '🌈 選択肢を広げるためのポーズ', '🤝 納得いくまで急がない勇気', '✨ ナイス・ホールド！'
        ],
        shareLabel: '＼ 画像を共有・保存 ／', share: '📤 シェア', copyImg: '📋 コピー', download: '💾 保存',
        pwaNotice: '📱 あなたのスマホに保留ボタンを出したい方は<br><strong>共有からホーム画面に追加</strong>を',
        recruitment: '🎨 <button type="button" class="recruitment-link" onclick="copySpecToClipboard()">背景画像募集中！（クリックで仕様をコピー）</button>',
        alertInput: '保留する内容を入力してください', alertNotFound: 'images フォルダ内に画像が見つかりませんでした。',
        alertLoadError: '画像の読み込みに失敗しました。', alertCopiedSpec: '仕様をコピーしました！',
        alertCopiedImg: '画像をクリップボードにコピーしました！', modalMsg: '画像を長押しして保存してください'
      },
      en: {
        title: '⏸️ Pending Button', subTitle: 'A smart & positive choice to pause',
        placeholder: 'What do you want to put on hold?', preset1: 'Decision: ', preset2: 'Conclusion: ', preset3: 'Evaluation: ',
        actionBtn: 'Hold', suffix: 'Put on Hold',
        messages: [
          '✨ Brilliant Judgment!', '🏆 Masterpiece Choice!', '🌿 No need to rush', '💡 New perspective emerging',
          '☕️ Time to take a breath', '🧠 Ideas are maturing', '🎯 Waiting for the best time', '🕊️ Peace preserved',
          '💎 Applause for a brave pause', '🧘 Cool-headed strategy', '🌟 Praise your decision', '🍷 Aging like fine wine',
          '🚀 Planning the next move', '🛡️ Smart & calm choice', '🎉 Pending is a decision!', '🍀 Margins matter',
          '🦉 Strategic tactical pause', '👑 Keeping your pace', '⏳ Time brings clarity', '🌈 Expanding options',
          '🤝 Courage to take time', '✨ Nice Hold!'
        ],
        shareLabel: '＼ Share or Save Image ／', share: '📤 Share', copyImg: '📋 Copy', download: '💾 Save',
        pwaNotice: '📱 Tap Share -> Add to Home Screen',
        recruitment: '🎨 <button type="button" class="recruitment-link" onclick="copySpecToClipboard()">Backgrounds Wanted!</button>',
        alertInput: 'Please enter something to put on hold.', alertNotFound: 'No images found.',
        alertLoadError: 'Failed to load images.', alertCopiedSpec: 'Specs copied!',
        alertCopiedImg: 'Image copied!', modalMsg: 'Press & hold image to save/copy.'
      }
    };

    const t = TRANSLATIONS[userLang];

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('appTitle').innerText = t.title;
      document.getElementById('appSubTitle').innerText = t.subTitle;
      document.getElementById('targetText').placeholder = t.placeholder;
      document.getElementById('preset1').innerText = t.preset1;
      document.getElementById('preset2').innerText = t.preset2;
      document.getElementById('preset3').innerText = t.preset3;
      document.getElementById('actionBtn').innerText = t.actionBtn;
      document.getElementById('shareLabel').innerText = t.shareLabel;
      document.getElementById('btnShare').innerText = t.share;
      document.getElementById('btnCopyImg').innerText = t.copyImg;
      document.getElementById('btnDownload').innerText = t.download;
      document.getElementById('pwaNotice').innerHTML = t.pwaNotice;
      document.querySelector('.recruitment-box').innerHTML = t.recruitment;
      document.getElementById('modalMsg').innerText = t.modalMsg;
    });

    function appendPreset(textToAppend) {
      var inputEl = document.getElementById('targetText');
      inputEl.value = inputEl.value + textToAppend;
      inputEl.focus();
    }

    function generateHoldCard() {
      var val = document.getElementById('targetText').value;
      if (!val || !val.trim()) {
        alert(t.alertInput);
        return;
      }

      var text = val.trim();
      var canvas = document.getElementById('holdCanvas');
      var ctx = canvas.getContext('2d');

      var apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
      var jsonUrl = `./${FOLDER_PATH}/bg_config.json?cache=${new Date().getTime()}`;

      Promise.all([
        fetch(apiUrl).then(res => res.json()),
        fetch(jsonUrl).then(res => res.ok ? res.json() : {}).catch(err => {
          console.warn("bg_config.jsonの読み込みに失敗しました。構文エラーの可能性があります:", err);
          return {};
        })
      ])
      .then(([files, configMap]) => {
        var imageFiles = files.filter(file => file.name.match(/\.(png|jpe?g|webp|gif)$/i));

        if (!Array.isArray(imageFiles) || imageFiles.length === 0) {
          alert(t.alertNotFound);
          return;
        }

        var randomIndex = Math.floor(Math.random() * imageFiles.length);
        var selectedImage = imageFiles[randomIndex];
        var imageName = selectedImage.name;
        
        // 画像名でJSON内の設定を取得
        var imageConfig = configMap[imageName] || {};

        console.log("--------------------------------");
        console.log("📷 選択された画像:", imageName);
        console.log("🎨 読み込まれた設定:", imageConfig);
        console.log("--------------------------------");

        var randomMsgIndex = Math.floor(Math.random() * t.messages.length);
        var selectedMsg = t.messages[randomMsgIndex];

        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = selectedImage.download_url;

        img.onload = function() {
          ctx.clearRect(0, 0, 800, 800);
          ctx.drawImage(img, 0, 0, 800, 800);

          drawOverlayTextWithConfig(ctx, text, imageConfig, selectedMsg);

          document.getElementById('imagePreviewArea').style.display = 'flex';
        };
      })
      .catch(err => {
        alert(t.alertLoadError);
        console.error(err);
      });
    }

function drawOverlayTextWithConfig(ctx, text, config, topMsg) {
      // 🌟 ベースラインを安定した標準値（alphabetic）に固定
      ctx.textBaseline = 'alphabetic';

      // 1. 【画面上部】褒め言葉・メッセージ描画 (y: 180px に変更して余裕を確保)
      if (topMsg) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px sans-serif';
        
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 6;
        ctx.strokeText(topMsg, 400, 180);
        
        ctx.fillStyle = '#475569';
        ctx.fillText(topMsg, 400, 180);
      }

      // 2. 【中央】入力テキスト描画
      var inputCfg = config.input || {};
      var inputColor = inputCfg.color || '#0F172A';
      var inputStroke = inputCfg.strokeColor || '#FFFFFF';
      var inputFont = inputCfg.font || "bold 50px sans-serif";
      var startY = inputCfg.y || 370;

      ctx.font = inputFont;
      
      let words = text.split('');
      let line = '';
      let lines = [];
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n];
        if (ctx.measureText(testLine).width > 540 && n > 0) {
          lines.push(line); line = words[n];
        } else { line = testLine; }
      }
      lines.push(line);

      lines.forEach((l, index) => {
        let y = startY + (index * 68);
        ctx.textAlign = 'center'; // 毎行確実にセンタリング
        ctx.strokeStyle = inputStroke;
        ctx.lineWidth = 14;
        ctx.strokeText(l, 400, y);
        ctx.fillStyle = inputColor;
        ctx.fillText(l, 400, y);
      });

      // 3. 【中央下】定型文（〜を保留しました）描画
      var suffixText = t.suffix;
      var suffixCfg = config.suffix || {};
      var suffixColor = suffixCfg.color || '#2563eb';
      var suffixStroke = suffixCfg.strokeColor || '#FFFFFF';
      var suffixFont = suffixCfg.font || "bold 44px sans-serif";
      var suffixY = suffixCfg.y || (startY + (lines.length * 68) + 15);

      ctx.textAlign = 'center';
      ctx.font = suffixFont;
      ctx.strokeStyle = suffixStroke;
      ctx.lineWidth = 12;
      ctx.strokeText(suffixText, 400, suffixY);
      ctx.fillStyle = suffixColor;
      ctx.fillText(suffixText, 400, suffixY);
    }

    function shareImage() {
      var canvas = document.getElementById('holdCanvas');
      canvas.toBlob(function(blob) {
        var file = new File([blob], "pending-card.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: t.title, text: `#保留ボタン` }).catch(() => {});
        } else { showCopyModal(); }
      });
    }

    function copyCanvasImage() {
      var canvas = document.getElementById('holdCanvas');
      if (!navigator.clipboard || !window.ClipboardItem) { showCopyModal(); return; }
      canvas.toBlob(function(blob) {
        try {
          var item = new ClipboardItem({ "image/png": blob });
          navigator.clipboard.write([item]).then(() => alert(t.alertCopiedImg)).catch(() => showCopyModal());
        } catch (err) { showCopyModal(); }
      });
    }

    function showCopyModal() {
      var canvas = document.getElementById('holdCanvas');
      document.getElementById('modalImg').src = canvas.toDataURL();
      document.getElementById('copyModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('copyModal').style.display = 'none';
    }

    function downloadImage() {
      var canvas = document.getElementById('holdCanvas');
      var link = document.createElement('a');
      link.download = 'pending-card.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function copySpecToClipboard() {
      const specText = `【依頼】「保留ボタン」用 背景画像 ＆ スタイル設定JSON作成\n...`;
      navigator.clipboard.writeText(specText).then(() => alert(t.alertCopiedSpec));
    }
  </script>
</body>
</html>
